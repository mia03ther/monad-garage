<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GENESIS · 造一座会呼吸的岛</title><link rel="icon" href="data:,"><link rel="stylesheet" href="sandbox/style.css"></head><body>
<canvas id="scene" tabindex="0" aria-label="浮岛建造场景，点击空地组装，右键拖动旋转视角"></canvas><div class="dpad" aria-label="岛内移动"><button data-move="w" aria-label="向前">↑</button><button data-move="a" aria-label="向左">←</button><button data-move="s" aria-label="向后">↓</button><button data-move="d" aria-label="向右">→</button></div>
<header><a href="index.html">◈ GENESIS <small>ISLAND LAB</small></a><div><span id="network">本地蓝图 · 未上链</span><button id="chain">蓝图上链 ↗</button></div></header>
<aside><span class="eyebrow">BUILD SOMETHING ALIVE</span><h1>造一座<br>会呼吸的岛。</h1><p>组装。连通。让它亮起来。</p><div id="mission"></div><button id="tour">▶ 观看 20 秒建造演示</button><button id="walk">进入岛内 · WASD</button></aside>
<section class="resources" id="resources"></section><div id="hint" role="status">选一个模块，点击发光地块组装。右键拖动转向，滚轮缩放。</div>
<section id="panel" hidden><button id="close">×</button><h2>把你的岛留在 Monad</h2><p>蓝图包含全部建造操作。合约校验 SHA-256 并记录作者和内容；别人读取后可重建。需要测试 MON 支付 gas。</p><label>已部署的 GenesisBlueprints 合约<input id="contract" placeholder="0x…（仅 Monad Testnet）"></label><button id="publish">连接钱包并发布蓝图</button><details><summary>首次设置：尚无蓝图合约？</summary><button id="deploy">用钱包部署蓝图合约（测试 MON）</button><p>会产生一笔额外部署交易。请使用专门的测试钱包。</p></details><label>从链上交易还原<input id="tx" placeholder="0x…交易哈希"></label><button id="restore-chain">读取并验证蓝图</button><p id="chain-result" role="status">尚未发送交易。</p><a id="explorer" hidden target="_blank" rel="noopener">查看链上交易 ↗</a></section>
<footer><div id="kit" aria-label="建造模块"></div><div class="tools"><button id="rotate">旋转 R · 0°</button><button id="erase">拆解 X · 全额回收</button><button id="tick">推进一天 ☀</button><button id="save">保存蓝图</button><label class="file">载入蓝图<input id="load" type="file" accept=".json,application/json"></label><button id="share">分享此岛 ↗</button><button id="reset">新建浮岛</button></div><p id="status">场景未就绪</p></footer><script type="module" src="sandbox/app.js"></script></body></html>
